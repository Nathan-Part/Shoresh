<style>
/* Mise en page : colonne unique pensée pour le pouce. Bandeau bleu nuit collant qui porte la jauge dorée
   de l'objectif, liste d'appels en carte blanche, onglets fixés en bas, fiche contact en panneau montant. */
:root{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#E8EBF6; --ink:#141A33; --muted:#5B6385; --line:#DCE0EE;
  --brand:#2B4EE6; --brand-ink:#FFFFFF; --brand-soft:#E0E6FE;
  --hero-a:#121A46; --hero-b:#2A3BA6; --hero-ink:#FFFFFF; --hero-muted:#C3CAF2; --hero-track:rgba(255,255,255,.16); --hero-chip:rgba(255,255,255,.13);
  --gold:#F2B33A; --gold-on:#3A2600; --gold-text:#855600; --gold-soft:#FCEEC8;
  --slate:#454E73; --slate-soft:#E4E7F4;
  --cyan:#0A6C88; --cyan-soft:#D5F0F8;
  --violet:#6A3FB5; --violet-soft:#ECE3FB; --lilac:#BBA8F6;
  --red:#B4233C; --red-soft:#FCE1E6;
  --grey:#666C82; --grey-soft:#ECEEF3;
  --veil:rgba(13,18,48,.5);
  --shadow:0 12px 32px rgba(20,26,51,.18);
  --shadow-s:0 1px 2px rgba(20,26,51,.06);
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --col:560px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F22; --surface:#141A35; --surface-2:#1E2547; --ink:#E9ECFB; --muted:#9BA4CB; --line:#29305A;
    --brand:#8198FF; --brand-ink:#0A1030; --brand-soft:#1D2A66;
    --hero-a:#0E1540; --hero-b:#22318F; --hero-ink:#FFFFFF; --hero-muted:#B9C2EE; --hero-track:rgba(255,255,255,.16); --hero-chip:rgba(255,255,255,.13);
    --gold:#F4BE55; --gold-on:#3A2600; --gold-text:#F4C76B; --gold-soft:#3B2E0E;
    --slate:#B4BCE0; --slate-soft:#252C52;
    --cyan:#6FD0EA; --cyan-soft:#0F3340;
    --violet:#C6A8F5; --violet-soft:#2C2150; --lilac:#BBA8F6;
    --red:#F4909F; --red-soft:#431A24;
    --grey:#A3A9C0; --grey-soft:#22273D;
    --veil:rgba(0,0,0,.62);
    --shadow:0 12px 32px rgba(0,0,0,.55);
    --shadow-s:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F22; --surface:#141A35; --surface-2:#1E2547; --ink:#E9ECFB; --muted:#9BA4CB; --line:#29305A;
  --brand:#8198FF; --brand-ink:#0A1030; --brand-soft:#1D2A66;
  --hero-a:#0E1540; --hero-b:#22318F; --hero-ink:#FFFFFF; --hero-muted:#B9C2EE; --hero-track:rgba(255,255,255,.16); --hero-chip:rgba(255,255,255,.13);
  --gold:#F4BE55; --gold-on:#3A2600; --gold-text:#F4C76B; --gold-soft:#3B2E0E;
  --slate:#B4BCE0; --slate-soft:#252C52;
  --cyan:#6FD0EA; --cyan-soft:#0F3340;
  --violet:#C6A8F5; --violet-soft:#2C2150; --lilac:#BBA8F6;
  --red:#F4909F; --red-soft:#431A24;
  --grey:#A3A9C0; --grey-soft:#22273D;
  --veil:rgba(0,0,0,.62);
  --shadow:0 12px 32px rgba(0,0,0,.55);
  --shadow-s:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero-a)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:var(--col);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* Couleur de chaque résultat d'appel : --c pour le texte, --cs pour le fond */
.s-neutre{--c:var(--muted);--cs:var(--surface-2)}
.s-ardoise{--c:var(--slate);--cs:var(--slate-soft)}
.s-cyan{--c:var(--cyan);--cs:var(--cyan-soft)}
.s-violet{--c:var(--violet);--cs:var(--violet-soft)}
.s-or{--c:var(--gold-text);--cs:var(--gold-soft)}
.s-rouge{--c:var(--red);--cs:var(--red-soft)}
.s-gris{--c:var(--grey);--cs:var(--grey-soft)}

/* Bandeau d'objectif */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:0 0 22px 22px;box-shadow:var(--shadow)}
.top-in{padding-block:12px 14px;display:grid;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:18px;font-weight:700}
.mode{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--hero-chip);font-size:12px;font-weight:600;color:var(--hero-ink);white-space:nowrap}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--hero-muted)}
.mode.live i{background:var(--gold)}
.obj-n{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.obj-n strong{font-family:var(--font-display);font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
.obj-n span{color:var(--hero-muted);font-size:14px}
.obj-n .pct{margin-left:auto;color:var(--gold);font-weight:700;font-size:15px}
.bar{display:flex;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.top .bar{background:var(--hero-track)}
.bar i{display:block;height:100%;transition:width .3s}
.bar .b-donne{background:var(--gold)}
.bar .b-promis{background:repeating-linear-gradient(135deg,var(--lilac) 0 5px,transparent 5px 9px)}
.bar.mini{height:6px;border-radius:3px}
.obj-s{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;color:var(--hero-muted);font-variant-numeric:tabular-nums}
.obj-s b{color:var(--hero-ink);font-weight:600}
.lien-btn{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.resume{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.resume b{color:var(--ink)}

main{padding-block:16px 150px;display:grid;gap:14px;align-content:start}

/* Recherche et filtres */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;box-shadow:var(--shadow-s)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:13px 0;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip b{font-weight:600;opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.mes{border-color:var(--brand);color:var(--brand)}
.chip.mes[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* Lignes de contact, groupées dans une carte */
.liste{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-s)}
.lig{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:3px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.lig:last-child{border-bottom:0}
.lig:active{background:var(--surface-2)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--cs);color:var(--c);font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em}
.lig-id{display:grid;min-width:0}
.lig-nom{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.lig-tel{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.lig-sub{grid-column:2/-1;font-size:13px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--cs);color:var(--c)}
.pill.s-neutre{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.sec{font-family:var(--font-body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.sec.retard{color:var(--red)}

/* États */
.vide{display:grid;gap:12px;padding:22px 18px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.vide h2{font-size:22px}
.vide p{color:var(--muted);max-width:44ch}
.info{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--brand-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}
.info.alerte{background:var(--gold-soft)}
.info button{flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.wa{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{min-height:38px;padding:0 12px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:default}
.grow{flex:1 1 140px}
.champ{display:grid;gap:6px}
.champ>span{font-size:13px;font-weight:600;color:var(--muted)}
.champ input,.champ textarea,.champ select{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.champ input:focus,.champ textarea:focus,.champ select:focus{border-color:var(--brand);outline:none}
.champ textarea{resize:vertical;min-height:84px}
.aide{font-size:13px;color:var(--muted)}
.bloc{display:grid;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-s)}
.bloc h2{font-size:19px}
.bloc .champ input,.bloc .champ textarea,.bloc .champ select{background:var(--bg)}

/* Compteur de l'équipe */
.eq{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.eq:last-child{border-bottom:0}
.eq-id{display:grid;gap:4px;min-width:0}
.eq-id strong{font-size:16px;overflow-wrap:anywhere}
.eq-id span{font-size:13px;color:var(--muted)}
.eq-m{display:grid;justify-items:end;font-variant-numeric:tabular-nums}
.eq-m strong{font-family:var(--font-display);font-size:20px;font-weight:700}
.eq-m span{font-size:12.5px;color:var(--violet);font-weight:600}

/* Bouton d'ajout flottant */
.fab{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px),calc(50% - var(--col) / 2 + 16px));bottom:calc(80px + env(safe-area-inset-bottom,0px));min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px}

/* Onglets */
.tabs{position:fixed;z-index:7;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{position:relative;display:grid;justify-items:center;gap:2px;padding:8px 0 7px;border:0;background:none;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{box-sizing:content-box;padding:3px 12px;border-radius:12px}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] svg{background:var(--brand-soft)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--red);color:var(--surface);font-size:11px;font-weight:700;line-height:18px;text-align:center}

/* Panneau montant */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.voile{position:absolute;inset:0;background:var(--veil);border:0}
.panneau{position:relative;width:100%;max-width:var(--col);max-height:94%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.poignee{justify-self:center;width:44px;height:5px;border-radius:3px;background:var(--line)}
.p-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.p-tete h2{font-size:clamp(19px,5.6vw,24px);overflow-wrap:anywhere;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fermer{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.numero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.numero .tel{font-family:var(--font-display);font-size:clamp(21px,6.4vw,26px);font-weight:700;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;letter-spacing:.01em}
.meta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.attrib{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.attrib select{font-size:16px;font-weight:600;color:var(--ink);padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);max-width:46vw}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actions .btn{padding:0 8px;font-size:15px}
.statuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.st{display:flex;align-items:center;gap:9px;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;padding:0 12px;text-align:left}
.st i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.st.s-or i{background:var(--gold)}
.st[aria-pressed="true"]{background:var(--cs);color:var(--c);border-color:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.rapides{display:flex;gap:8px;flex-wrap:wrap}
details{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
summary{padding:12px 14px;font-weight:600;cursor:pointer}
details>div{padding:0 14px 14px;display:grid;gap:12px}
.script{white-space:pre-wrap;font-size:16px;line-height:1.55}
.hist{display:grid;gap:10px}
.hist li{display:grid;gap:1px;font-size:14px}
.hist span{color:var(--muted);font-size:13px}
.apercu{width:100%;border-collapse:collapse;font-size:14px}
.apercu th,.apercu td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}

.scroll-x{overflow-x:auto}
.ou{font-size:13px;font-weight:600;color:var(--muted);text-align:center}
.check{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600}

.pied{position:sticky;bottom:0;z-index:1;display:grid;grid-template-columns:1.6fr 1fr;gap:8px;background:var(--bg);border-top:1px solid var(--line);margin-inline:-4px;padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px))}
.pied .btn{padding:0 8px;min-width:0;line-height:1.15}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}

.marque{display:flex;align-items:center;gap:10px;min-width:0}

.solde svg{color:var(--gold)}
.montant{font-family:var(--font-display);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.eq-act{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn.small[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:max-content;max-width:min(92vw,480px);background:var(--gold);color:var(--gold-on);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);text-align:center}
@media (max-width:360px){

  .obj-n strong{font-size:30px}

}

    const h = {t: Date.now(), p: S.perso.prenom || '', s: b.statut, m: b.statut === 'donne' ? cible.donne : b.statut === 'promesse' ? cible.promis : 0};

  const next = suivant ? suivantDe(id) : null;

  toast(next ? (change ? 'Enregistré. Contact suivant.' : 'Contact suivant.') : suivant ? (change ? 'Enregistré. Plus personne à appeler dans cette liste.' : 'Plus personne à appeler dans cette liste.') : change ? 'Enregistré' : 'Aucun changement');

/* ---------- Import ---------- */
function parseCSV(txt) {
  txt = txt.replace(/^\uFEFF/, '');
  const l1 = txt.split(/\r?\n/, 1)[0] || '';
  const sep = [';', '\t', ','].map(s => [s, l1.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
async function lireFichier(file) {
  const buf = await file.arrayBuffer();
  if (/\.(csv|txt)$/i.test(file.name) || !window.XLSX) {
    if (!/\.(csv|txt)$/i.test(file.name)) throw new Error('xlsx');
    return parseCSV(new TextDecoder('utf-8').decode(buf));
  }
  const wb = XLSX.read(buf, {type: 'array'});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: false, defval: ''});
}
function texteVersLignes(txt) {
  return txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/(?:\+\s?\d|\b0)[\d\s.\-()\/]{6,}\d/) || l.match(/\d[\d\s.\-()\/]{6,}\d/);
    if (!m) return [l, ''];
    const nom = (l.slice(0, m.index) + ' ' + l.slice(m.index + m[0].length)).replace(/[;,\t|:]+/g, ' ').replace(/\s+/g, ' ').trim();
    return [nom, m[0]];
  });
}
const RX = {
  tel: /t[ée]l|phone|mobile|portable|num[ée]ro|gsm|cell/, tel2: /fixe|domicile|bureau|travail/, prenom: /pr[ée]nom|first/, nom: /nom|name|contact/, note: /note|comment|remarque/,
  statut: /statut|status|[ée]tat/, promis: /promis|promesse/, donne: /donn[ée]/, rappel: /rappel/, par: /appelant/, maj: /mis [àa] jour/, tentatives: /tentative/,
  ancien: /dons?\s*(20\d\d|pr[ée]c|pass|ancien|dernier)|dernier don|^dons?(\s*\(.*\))?$/, pour: /attribu|assign/, lien: /lien envoy/, moyen: /moyen|paiement/,

function analyser(rows, fichier) {
  rows = rows.map(r => r.map(x => String(x ?? '').trim())).filter(r => r.some(x => x !== ''));
  if (!rows.length) return null;
  const n = Math.max(...rows.map(r => r.length));
  const ressembleTel = x => { const d = x.replace(/\D/g, ''); return d.length >= 8 && d.length <= 15 && d.length >= x.replace(/\s/g, '').length * 0.7 && !/^\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{2,4}$/.test(x); };
  const CLES = ['prenom', 'statut', 'ancien', 'promis', 'donne', 'rappel', 'pour', 'par', 'maj', 'tentatives', 'lien', 'moyen', 'note', 'nom'];
  /* La ligne de titres n'est pas toujours la première : on la cherche dans les 10 premières lignes */
  let debut = 0, entetes = false;
  if (fichier) {
    let best = 0;
    rows.slice(0, 10).forEach((r, i) => {
      if (r.some(ressembleTel) || (n > 1 && r.filter(Boolean).length < 2)) return;
      const l = r.map(x => x.toLowerCase());
      if (!l.some(h => RX.tel.test(h) || RX.tel2.test(h) || RX.nom.test(h) || RX.prenom.test(h))) return;
      const score = l.filter(h => h && (RX.tel.test(h) || RX.tel2.test(h) || CLES.some(k => RX[k].test(h)))).length;
      if (score > best) { best = score; debut = i + 1; entetes = true; }
    });
  }
  const cols = {tel: -1, tel2: -1, nom: -1, prenom: -1, note: -1, ancien: -1, pour: -1, lien: -1, moyen: -1, statut: -1, promis: -1, donne: -1, rappel: -1, par: -1, maj: -1, tentatives: -1};

    const mobile = tels.find(i => /portable|mobile|gsm|cell/.test(l1[i]));

  if (cols.tel < 0) { const b = meilleur(-1); cols.tel = b < 0 ? 0 : b; }

      if (Object.values(cols).includes(i)) continue;
      if (corps.some(r => /[a-zA-Z\u00C0-\u024F\u0590-\u05FF]/.test(r[i] || ''))) { cols.nom = i; break; }
    }

    const lettre = String.fromCharCode(65 + (i % 26));
    const ex = entetes ? rows[debut - 1][i] : (corps.find(r => r[i]) || [])[i];
    return 'Colonne ' + lettre + (ex ? ' : ' + String(ex).slice(0, 24) : '');

}
function construire(an) {

  for (const r of an.rows.slice(an.entetes ? an.debut : 0)) {
    let tel = normTel(col(r, 'tel'), ind);
    if (!telValide(tel)) tel = normTel(col(r, 'tel2'), ind);
    if (!telValide(tel)) { sansTel++; continue; }
    if (vus.has(tel)) { doublons++; continue; }
    vus.add(tel);
    const sLabel = plain(col(r, 'statut'));
    const st = STATUTS.find(s => plain(s.nom) === sLabel);
    const res = st && st.id !== 'a_appeler' ? {
      statut: st.id, promis: num(col(r, 'promis')), donne: num(col(r, 'donne')),
      rappel: /^\d{4}-\d\d-\d\d[ T]\d\d:\d\d/.test(col(r, 'rappel')) ? col(r, 'rappel').slice(0, 16).replace(' ', 'T') : '',
      par: col(r, 'par'), tentatives: parseInt(col(r, 'tentatives'), 10) || 0,

      const c = S.contacts.get(exist), patch = {};
      if (res && (!c.statut || c.statut === 'a_appeler' || (res.maj || 0) > (c.maj || 0))) Object.assign(patch, res, note ? {note} : {});
      if (ancien && !+c.ancien) patch.ancien = ancien;
      if (pour && !c.pour) patch.pour = pour;
      if (Object.keys(patch).length) majs.push({id: exist, creer: false, data: patch}); else doublons++;
      continue;
    }
    const nom = [col(r, 'prenom'), col(r, 'nom')].filter(Boolean).join(' ') || fmtTel(tel);

  S.filtre = 'tous'; S.vue = 'appels'; location.hash = 'appels';
  render();
  toast(r.echecs ? `${r.fait} contacts importés, ${r.echecs} non enregistrés. Relance l'import pour les ajouter.` : `${r.fait} contact${r.fait > 1 ? 's' : ''} importé${r.fait > 1 ? 's' : ''}`);
}

/* ---------- Export ---------- */
async function exporter() {
  const lignes = [['Nom', 'Téléphone', 'Statut', 'Promis (€)', 'Donné (€)', 'Moyen de paiement', 'Don précédent (€)', 'Rappel', 'Note', 'Attribué à', 'Lien envoyé', 'Tentatives', 'Dernier appelant', 'Mis à jour']];
  for (const c of tous()) lignes.push([c.nom || '', c.tel || '', (ST[c.statut] || ST.a_appeler).nom, +c.promis || 0, +c.donne || 0, c.moyen || '', +c.ancien || 0, (c.rappel || '').replace('T', ' '), c.note || '', c.pour || '', c.lien ? 'oui' : '', +c.tentatives || 0, c.par || '', c.maj ? isoLocal(new Date(c.maj)).replace('T', ' ') : '']);
  const jour = isoLocal(new Date()).slice(0, 10);
  let data, nom;
  if (window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet(lignes);
    ws['!cols'] = [24, 16, 16, 11, 11, 17, 17, 17, 40, 14, 12, 11, 16, 17].map(w => ({wch: w}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Appels');
    data = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
    nom = `appels-shoresh-${jour}.xlsx`;
  } else {
    data = '\uFEFF' + lignes.map(l => l.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(';')).join('\r\n');
    nom = `appels-shoresh-${jour}.csv`;
  }
  const cl = window.claude;
  if (cl && typeof cl.use === 'function') {
    const dl = await cl.use('downloads');
    if (dl) {
      try { await dl.save({filename: nom, data}); toast('Fichier enregistré'); }
      catch (e) { if (!e || e.code !== 'declined') toast("L'export n'a pas pu être enregistré. Réessaie dans un instant."); }
      return;
    }
    await copier(lignes.map(l => l.join('\t')).join('\n'), 'Export copié. Colle-le dans Excel.');
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data]));
  a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Fichier téléchargé');
}

/* ---------- Actions ---------- */
function allerVue(v) {
  if (!VUES.includes(v)) v = 'appels';
  if (v !== S.vue) { S.epingles.clear(); S.eqRetirer = ''; }
  S.vue = v;
  if (location.hash.slice(1) !== v) { try { location.hash = v; } catch (e) {} }
  render();
  window.scrollTo(0, 0);
}
function ajouterContact(encore) {
  const j = S.sheet, tel = normTel(j.tel, S.perso.indicatif);
  if (!telValide(tel)) { toast('Entre un numéro de téléphone valide.'); const t = $('#j-tel'); if (t) t.focus(); return; }
  for (const c of S.contacts.values()) if (c.tel === tel) { toast('Ce numéro est déjà dans la liste : ' + (c.nom || fmtTel(tel))); return; }
  const data = {nom: j.nom.trim() || fmtTel(tel), tel, statut: 'a_appeler', promis: 0, donne: 0, rappel: '', note: j.note.trim(), tentatives: 0, par: '', maj: 0, cree: Date.now(), ordre: maxOrdre() + 1};
  store.sauver(uid(), data, true);
  toast('Contact ajouté');
  if (encore) { ouvrirSheet({type: 'ajout', nom: '', tel: '', note: ''}); const n = $('#j-nom'); if (n) n.focus(); }
  else fermerSheet();
}
/* Remet le contact comme s'il n'avait pas été appelé ; la note et l'historique sont gardés */
function retirerResultat() {
  const sh = S.sheet, c = S.contacts.get(sh.id), b = S.brouillon;
  if (!c || !b) return;
  if (S.mode === 'shared' && S.horsLigne) { toast('Pas de connexion : le résultat ne peut pas être retiré pour le moment.'); return; }
  if ((+c.donne || +c.promis) && !b.retirer) { b.retirer = true; renderSheet(); return; }
  const t = Date.now(), moi = S.perso.prenom || '';
  const patch = {statut: 'a_appeler', promis: 0, donne: 0, rappel: '', moyen: '', lien: false, tentatives: 0, maj: t, par: moi,
    hist: [...(Array.isArray(c.hist) ? c.hist : []), {t, p: moi, s: 'a_appeler', m: 0}].slice(-20)};
  Object.assign(b, {statut: 'a_appeler', promis: '', donne: '', rappel: '', moyen: '', lien: false, touche: false, retirer: false, sansMontantOk: false});
  sh.majVu = t; sh.autre = null;
  S.epingles.add(sh.id);
  store.sauver(sh.id, patch);
  toast('Résultat annulé : le contact est de nouveau « à appeler »');
}
const ACTIONS = {
  vue: el => allerVue(el.dataset.v),
  filtre: el => { S.filtre = el.dataset.f; S.limite = 200; S.epingles.clear(); rafraichirAppels(); },
  detail: () => ouvrirSheet({type: 'detail'}),
  'retirer-resultat': () => retirerResultat(),
  moyen: el => { const b = S.brouillon; b.moyen = b.moyen === el.dataset.m ? '' : el.dataset.m; renderSheet(); },
  plus: () => { S.limite += 200; rafraichirAppels(); },
  mes: () => {
    if (!moi()) { toast('Entre ton prénom dans Réglages pour voir tes contacts.'); return; }
    sauverPerso({mes: !S.perso.mes}); S.limite = 200; S.epingles.clear(); rafraichirAppels();
  },
  repartir: async () => {
    const noms = equipe();
    if (!noms.length) { toast("Ajoute d'abord une personne dans l'équipe."); return; }
    const cibles = tous().filter(c => statutDe(c) === 'a_appeler' && !c.pour);
    if (!cibles.length) { toast('Aucun contact libre à répartir.'); return; }
    S.formSale = true;
    const z = $('#zone-repartir'); if (z) z.innerHTML = '<p class="aide">Répartition en cours…</p>';
    const ok = await store.sauverConfig({equipe: noms});
    const r = ok ? await store.lot(cibles.map((c, i) => ({id: c.id, creer: false, data: {pour: noms[i % noms.length]}})), () => {}) : {fait: 0, echecs: 0};
    S.formSale = false; render();
    if (!ok) return;
    toast(r.echecs ? `${r.fait} contacts répartis, ${r.echecs} non enregistrés. Relance la répartition.` : `${r.fait} contact${r.fait > 1 ? 's' : ''} réparti${r.fait > 1 ? 's' : ''} entre ${noms.length} personne${noms.length > 1 ? 's' : ''}`);
  },
  'eq-ajouter': async () => {
    const champ = $('#e-nom'), nom = champ.value.trim();
    if (!nom) { toast('Entre un prénom.'); champ.focus(); return; }
    if (equipe().some(n => plain(n) === plain(nom))) { toast(nom + " est déjà dans l'équipe."); return; }
    S.formSale = false;
    const ok = await inscrire(nom);
    if (ok) toast(nom + " ajouté à l'équipe");
  },
  'eq-moi': async el => {
    const nom = el.dataset.n;
    sauverPerso({prenom: nom}); S.formSale = false;
    await inscrire(nom);
    render(); toast('Sur cet appareil, tu es ' + nom);
  },
  'eq-retirer': el => { S.eqRetirer = el.dataset.n; S.formSale = false; construireVue(); },
  'eq-retirer-non': () => { S.eqRetirer = ''; construireVue(); },
  'eq-retirer-ok': async () => {
    const nom = S.eqRetirer; S.eqRetirer = '';
    if (!nom) return;
    const reste = (Array.isArray(S.config.equipe) ? S.config.equipe : []).filter(n => plain(n) !== plain(nom));
    const cibles = tous().filter(c => plain(String(c.pour || '').trim()) === plain(nom));
    S.formSale = true;
    const ok = await store.sauverConfig({equipe: reste});
    const r = ok && cibles.length ? await store.lot(cibles.map(c => ({id: c.id, creer: false, data: {pour: ''}})), () => {}) : {fait: 0, echecs: 0};
    if (ok && plain(nom) === moi()) sauverPerso({prenom: '', mes: false});
    S.formSale = false; render();
    if (ok) toast(r.echecs ? `${nom} retiré, mais ${r.echecs} contacts lui restent attribués. Réessaie.` : `${nom} retiré de l'équipe${cibles.length ? ', ' + cibles.length + ' contact' + (cibles.length > 1 ? 's' : '') + ' libéré' + (cibles.length > 1 ? 's' : '') : ''}`);
  },
  desattribuer: () => {
    $('#zone-repartir').innerHTML = `<button type="button" class="btn danger grow" data-a="desattribuer-ok">Oui, retirer les attributions</button><button type="button" class="btn grow" data-a="effacer-non">Annuler</button>`;
  },
  'desattribuer-ok': async () => {
    const cibles = tous().filter(c => c.pour);
    S.formSale = true;
    $('#zone-repartir').innerHTML = '<p class="aide">Retrait en cours…</p>';
    const r = await store.lot(cibles.map(c => ({id: c.id, creer: false, data: {pour: ''}})), () => {});
    S.formSale = false; render();
    toast(r.echecs ? `${r.fait} attributions retirées, ${r.echecs} restantes. Réessaie.` : 'Attributions retirées');
  },
  ouvrir: el => ouvrir(el.dataset.id),
  fermer: () => { if (!(S.sheet && S.sheet.cours)) fermerSheet(); },
  ajouter: () => ouvrirSheet({type: 'ajout', nom: '', tel: '', note: ''}),
  importer: () => ouvrirSheet({type: 'import', etape: 'choix', texte: ''}),
  'note-ok': () => { sauverPerso({noteVue: true}); rafraichirAppels(); },
  reessayer: () => { if (db) demarrerPartage(); },
  statut: el => {
    const b = S.brouillon, c = S.contacts.get(S.sheet.id), s = el.dataset.s;
    if (b.statut === s) {
      /* Retoucher le résultat déjà choisi l'annule */
      if (c && statutDe(c) === s) retirerResultat();
      else { b.statut = c ? statutDe(c) : 'a_appeler'; b.touche = false; renderSheet(); }
      return;
    }
    b.statut = s; b.touche = true; b.retirer = false;
    if (b.statut === 'donne' && !b.donne && b.promis) b.donne = b.promis;
    renderSheet();
  },
  encore: () => { S.brouillon.touche = !S.brouillon.touche; renderSheet(); },
  'rappel-vite': el => {
    const d = new Date(), k = el.dataset.k;
    if (k === '1h') d.setMinutes(d.getMinutes() + 60);
    else if (k === 'soir') { d.setHours(20, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); }
    else { d.setDate(d.getDate() + 1); d.setHours(18, 0, 0, 0); }
    S.brouillon.rappel = isoLocal(d); renderSheet();
  },
  'copier-tel': () => { const c = S.contacts.get(S.sheet.id); if (c) copier(fmtTel(c.tel), 'Numéro copié'); },
  'copier-msg': () => { const c = S.contacts.get(S.sheet.id); if (c) copier(remplir(S.config.message, c), 'Message copié'); },
  'copier-lien': () => copier(lienDon(), 'Lien de don copié'),
  enregistrer: () => enregistrer(false),
  'enregistrer-suivant': () => enregistrer(true),
  supprimer: () => { S.brouillon.supprimer = true; S.brouillon.editOuvert = true; renderSheet(); },
  'supprimer-ok': () => { const id = S.sheet.id; fermerSheet(); store.supprimer(id); toast('Contact supprimé'); },
  'ajout-ok': () => ajouterContact(false),
  'ajout-encore': () => ajouterContact(true),
  'analyser-texte': () => versApercu(analyser(texteVersLignes(S.sheet.texte || ''), false)),
  'import-retour': () => ouvrirSheet({type: 'import', etape: 'choix', texte: S.sheet.texte || ''}),
  'import-ok': () => lancerImport(),
  exporter: () => exporter(),
  'sauver-config': async () => {
    S.formSale = false;
    const ok = await store.sauverConfig({objectif: num($('#c-objectif').value), lien: $('#c-lien').value.trim()});
    if (ok) toast('Objectif et lien enregistrés');
  },
  'sauver-perso': () => {
    S.formSale = false;
    sauverPerso({prenom: $('#p-prenom').value.trim(), lien: $('#p-lien').value.trim(), indicatif: $('#p-ind').value});
    inscrire(S.perso.prenom);
    render(); toast('Réglages enregistrés');
  },
  'sauver-script': async () => {
    S.formSale = false;
    const ok = await store.sauverConfig({script: $('#c-script').value, message: $('#c-message').value});
    if (ok) toast('Textes enregistrés');
  },
  effacer: () => {
    $('#zone-effacer').innerHTML = `<button type="button" class="btn danger grow" data-a="effacer-ok">Oui, tout effacer</button><button type="button" class="btn grow" data-a="effacer-non">Annuler</button>`;
  },
  'effacer-non': () => { S.formSale = false; construireVue(); },
  'effacer-ok': async () => {
    const z = $('#zone-effacer');
    z.innerHTML = '<p class="aide">Suppression en cours…</p>';
    const r = await store.toutEffacer(() => {});
    render();
    toast(r.echecs ? `${r.fait} contacts effacés, ${r.echecs} restants. Réessaie.` : 'Liste effacée');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const f = ACTIONS[el.dataset.a];
  if (f) f(el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.recherche = t.value; S.limite = 200; rafraichirAppels(); }
  else if (t.dataset.b !== undefined && S.brouillon) S.brouillon[t.dataset.b] = t.value;
  else if (t.dataset.j !== undefined && S.sheet) S.sheet[t.dataset.j] = t.value;
  else if (t.dataset.f !== undefined) S.formSale = true;
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'f-import' && t.files && t.files[0]) {
    try { versApercu(analyser(await lireFichier(t.files[0]), true)); }
    catch (err) { toast(err && err.message === 'xlsx' ? 'Lecture Excel indisponible. Enregistre ton fichier en CSV et réessaie.' : "Ce fichier n'a pas pu être lu. Essaie un fichier .xlsx ou .csv."); }
  } else if (t.dataset.col !== undefined && S.sheet && S.sheet.an) {
    S.sheet.an.cols[t.dataset.col] = +t.value;
    S.sheet.resultat = construire(S.sheet.an); renderSheet();
  } else if (t.dataset.bc !== undefined && S.brouillon) {
    S.brouillon[t.dataset.bc] = t.checked;
  } else if (t.dataset.attrib !== undefined && S.sheet && S.sheet.type === 'contact') {
    /* L'attribution s'enregistre tout de suite, sans attendre « Enregistrer » */
    const id = S.sheet.id; S.epingles.add(id);
    store.sauver(id, {pour: t.value});
    toast(t.value ? 'Attribué à ' + t.value : 'Attribution retirée');
  } else if (t.dataset.b !== undefined && S.brouillon) {
    S.brouillon[t.dataset.b] = t.value;
  } else if (t.id === 'i-entetes' && S.sheet && S.sheet.an) {
    S.sheet.an.entetes = t.checked;
    S.sheet.resultat = construire(S.sheet.an); renderSheet();
  }
});
document.addEventListener('toggle', e => {
  const k = e.target.dataset && e.target.dataset.d;
  if (k && S.brouillon) S.brouillon[k] = e.target.open;
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet && !S.sheet.cours) fermerSheet(); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VUES.includes(v) && v !== S.vue) allerVue(v); });
window.addEventListener('offline', () => { S.horsLigne = true; render(); });
window.addEventListener('online', () => { S.horsLigne = false; render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !S.sheet) render(); });

/* ---------- Démarrage ---------- */
async function connecter() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') { demarrerLocal(); return; }
  let u = null;
  try { [db, u] = await Promise.all([cl.use('db'), cl.use('user')]); } catch (e) { db = null; }
  if (!db) { demarrerLocal(); return; }
  try {
    S.peutEcrire = u ? await u.can('data.write') : null;
    S.proprio = u ? await u.isOwner() : false;
  } catch (e) { S.peutEcrire = null; }
  if (S.peutEcrire === false) { demarrerLocal(); return; }
  demarrerPartage();
}
function start(data) {
  S.perso = {...S.perso, ...LS.get(K_PERSO, {})};
  S.horsLigne = navigator.onLine === false;
  const h = location.hash.slice(1);
  if (VUES.includes(h)) S.vue = h;
  if (data && typeof data === 'object') {
    if (VUES.includes(data.vue)) S.vue = data.vue;
    if (typeof data.filtre === 'string') S.filtre = data.filtre;
    if (typeof data.recherche === 'string') S.recherche = data.recherche;
    if (data.sheet && data.sheet.type === 'contact') S.aRestaurer = data;
  }
  render();
  connecter();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') {
  hot.snapshot(() => ({vue: S.vue, filtre: S.filtre, recherche: S.recherche, sheet: S.sheet && S.sheet.type === 'contact' ? S.sheet : null, brouillon: S.brouillon, suite: S.suite}));
}
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
